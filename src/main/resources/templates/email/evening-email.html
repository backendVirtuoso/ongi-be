<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 저녁의 온기</title>
  <style>
    @media (prefers-color-scheme: dark) {
      body { background-color: #1a1030 !important; }
      .email-card { background-color: #120c24 !important; }
      .email-card h1 { color: #ddd6fe !important; }
      .email-card p { color: #e2e8f0 !important; }
      .quote-block { background-color: #1e1040 !important; }
    }
  </style>
</head>
<body style="font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f0f0ff; margin: 0; padding: 40px 0;">
  <!-- Preheader: 수신함 미리보기 텍스트 -->
  <span style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">오늘 하루 수고하셨어요. 저녁 온기 한 문장을 드려요 🌙</span>

  <div class="email-card" style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 48px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
    <p style="font-size: 13px; color: #8b5cf6; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.05em;">🌙 저녁 온기</p>
    <h1 style="font-size: 22px; color: #1a1a1a; margin: 0 0 36px; font-weight: 700;">오늘 하루 수고했습니다</h1>

    <div class="quote-block" style="background: #f5f3ff; border-left: 4px solid #8b5cf6; border-radius: 8px; padding: 24px 28px; margin-bottom: 36px;">
      <p style="font-size: 18px; color: #333; line-height: 1.8; margin: 0;"
         th:text="${quoteContent}">문장이 여기에 표시됩니다.</p>
    </div>

    <p style="font-size: 14px; color: #777; text-align: center; margin: 0 0 24px;">
      카테고리: <span th:text="${category}" style="color: #8b5cf6; font-weight: 600;"></span>
    </p>

    <div style="text-align: center;">
      <a th:href="${frontendBaseUrl} + '/gallery'"
         style="display: inline-block; background: #8b5cf6; color: #fff; font-size: 14px; font-weight: 600; padding: 12px 32px; border-radius: 999px; text-decoration: none;">
        더 많은 문장 보기
      </a>
    </div>

    <hr style="border: none; border-top: 1px solid #f0ede8; margin: 36px 0;">
    <p style="font-size: 12px; color: #999; text-align: center;">
      © 2026 온기 (Ongi) ·
      <a th:href="${frontendBaseUrl} + '/unsubscribe'" style="color: #999;">구독 해지</a>
    </p>
  </div>
</body>
</html>
