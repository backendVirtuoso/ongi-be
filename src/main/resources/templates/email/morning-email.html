<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오늘 아침의 온기</title>
</head>
<body style="font-family: 'Apple SD Gothic Neo', sans-serif; background: #fefce8; margin: 0; padding: 40px 0;">
  <div style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 48px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
    <p style="font-size: 13px; color: #f59e0b; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.05em;">☀️ 아침 온기</p>
    <h1 style="font-size: 22px; color: #1a1a1a; margin: 0 0 36px; font-weight: 700;">오늘 하루도 응원합니다</h1>

    <div style="background: #fffbf0; border-left: 4px solid #f97316; border-radius: 8px; padding: 24px 28px; margin-bottom: 36px;">
      <p style="font-size: 18px; color: #333; line-height: 1.8; margin: 0; font-style: italic;"
         th:text="${quoteContent}">문장이 여기에 표시됩니다.</p>
    </div>

    <p style="font-size: 14px; color: #aaa; text-align: center; margin: 0 0 24px;">
      카테고리: <span th:text="${category}" style="color: #f97316; font-weight: 600;"></span>
    </p>

    <div style="text-align: center;">
      <a href="http://localhost:3000/gallery"
         style="display: inline-block; background: #f97316; color: #fff; font-size: 14px; font-weight: 600; padding: 12px 32px; border-radius: 999px; text-decoration: none;">
        더 많은 문장 보기
      </a>
    </div>

    <hr style="border: none; border-top: 1px solid #f0ede8; margin: 36px 0;">
    <p style="font-size: 12px; color: #ccc; text-align: center;">
      © 2025 온기 (Ongi) ·
      <a th:href="'http://localhost:3000/unsubscribe'" style="color: #ccc;">구독 해지</a>
    </p>
  </div>
</body>
</html>
