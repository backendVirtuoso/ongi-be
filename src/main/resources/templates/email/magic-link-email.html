<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>온기 로그인 링크</title>
</head>
<body style="font-family: 'Apple SD Gothic Neo', sans-serif; background: #fafaf8; margin: 0; padding: 40px 0;">
  <div style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 48px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
    <h1 style="font-size: 28px; color: #1a1a1a; margin: 0 0 8px;">🌤 온기</h1>
    <p style="color: #888; font-size: 14px; margin: 0 0 36px;">하루 두 번, 따뜻한 말 한마디</p>

    <p style="font-size: 16px; color: #333; line-height: 1.7;">
      안녕하세요, <strong th:text="${name}">구독자</strong>님!<br>
      로그인 링크를 보내드립니다.
    </p>
    <p style="font-size: 16px; color: #333; line-height: 1.7;">
      아래 버튼을 클릭하면 온기에 로그인되고, 마음에 드는 문장을 저장하고 좋아요를 표시할 수 있어요.
    </p>

    <div style="text-align: center; margin: 36px 0;">
      <a th:href="${magicLinkUrl}"
         style="display: inline-block; background: #f97316; color: #fff; font-size: 16px; font-weight: 600; padding: 14px 40px; border-radius: 999px; text-decoration: none;">
        로그인하기
      </a>
    </div>

    <p style="font-size: 13px; color: #aaa; line-height: 1.6;">
      이 링크는 <strong>15분</strong> 후 만료됩니다.<br>
      로그인을 요청하지 않으셨다면 이 이메일을 무시해주세요.
    </p>

    <hr style="border: none; border-top: 1px solid #f0ede8; margin: 36px 0;">
    <p style="font-size: 12px; color: #ccc; text-align: center;">
      © 2025 온기 (Ongi).
    </p>
  </div>
</body>
</html>
